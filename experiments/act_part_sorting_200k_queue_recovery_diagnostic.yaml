limitations:
  - Isaac physics settling was not perfectly deterministic despite matched seeds.
  - Seeds 1 and 3 did not have exactly matching post-warmup settled poses; the maximum observed position difference was 2.24 cm.
  - Only seeds 2, 4, and 5 qualify as exact settled-pose pairs.
  - Five paired seeds are diagnostic evidence, not a powered statistical study.
  - Resetting the queue changes subsequent trajectories, so displacement-event denominators differ between conditions.
  - Replanning improved aggregate placement but did not improve full-task completion and regressed two seeds.

technical_conclusion:
  classification: 2
  label: Some evidence, but not enough
  finding: Stale queued actions contribute to failures but are not sufficient to explain them.
  interpretation:
    - Queue clearing materially improved aggregate object placement.
    - The intervention did not consistently improve every seed.
    - The intervention did not improve the full-task completion rate.
    - Automatic displacement-triggered replanning should not be enabled permanently based on this diagnostic.

decision:
