  intervention: Clear only ACT's pending action queue with policy.reset() after a confirmed object displacement; generate a fresh chunk from the next observation.

event_definitions:
  displacement:
    horizontal_threshold_cm: 3.0
    confirmation_samples: 2
    refractory_seconds: 2.0
    exclusions:
      - Objects lifted more than 4 cm above their initial table height.
      - Objects already placed in the destination box.
  placement:
    definition: Object center remains inside the runtime destination-box bounds.
    dwell_seconds: 0.5
  strict_recovery:
    definition: The same displaced object remains in the destination box within the recovery window.
    recovery_window_seconds: 20.0

