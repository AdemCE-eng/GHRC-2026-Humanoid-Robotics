schema_version: 2
name: part_sorting_recovery_v2_pilot_v2
total_episodes: 50
# Unchanged from the original pilot config.
seed_base: 2026081600

scenario_mix:
  normal_control: 10
  object_displaced_during_approach: 10
  missed_first_grasp: 10
  drop_and_regrasp: 10
  difficult_position: 10

target_object_slot_cycle: [0, 1, 2, 3]

# Positions are deliberately near sparse regions while staying on the table and
# within the conservative reach envelope. The collector also checks separation
# from the other three parts after every reset.
difficult_positions_xyz:
  - [0.62, 0.135, 1.04]
  - [0.75, 0.135, 1.04]
  - [0.88, 0.135, 1.04]
  - [0.585, 0.25, 1.04]
  - [0.915, 0.30, 1.04]

# Unchanged from the original pilot config.
safety:
  workspace_x: [0.575, 0.925]
  workspace_y: [0.130, 0.430]
  workspace_z: [1.00, 1.12]
  minimum_object_separation_m: 0.10
  max_recovery_attempts_per_object: 3
  max_episode_seconds: 180.0
  joint_limit_margin_rad: 0.01
  gripper_limit_tolerance_m: 0.001

recovery:
  # Unchanged: the 0.03 m minimum was never touched by any of today's fixes.
  displacement_threshold_m: 0.03
  # Below: the validated closed-loop displacement parameters from the
  # targeted smoke test (Part_Sorting_Recovery_V2_Targeted_Displacement_v2),
  # replacing the original pilot's untested 0.14 m/s x 12-step values, which
  # predate the closed-loop fix and were shown to fall short of 0.03 m most
  # of the time. displacement_upper_bound_m/edge_margin_m are new keys the
  # closed loop reads with safe defaults (0.08/0.02) if absent; set
  # explicitly here for clarity.
  displacement_velocity_world_mps: [0.10, 0.0, 0.0]
  displacement_steps: 60
  displacement_upper_bound_m: 0.08
  displacement_edge_margin_m: 0.02
  missed_grasp_offset_world_m: [0.07, 0.0, 0.0]
  retreat_height_m: 0.30
  # Unchanged from the targeted displaced/drop smoke test (not re-touched
  # this pass; drop_and_regrasp's own logic was not modified).
  drop_release_height_above_table_m: 0.03
  drop_settle_steps: 30
  post_release_settle_steps: 10

ik_safety:
  max_robot_base_target_norm_m: 1.45
  max_target_delta_m: 1.25

dataset_contract:
  fps: 30
  rgb_cameras: 4
  observation_state_dim: 48
  action_dim: 20
  object_pose_dimensions: [20, 47]
  object_poses_policy_input: false
  temporal_convention: observation_t paired with action_selected_from_observation_t before world.step
