schema_version: 2
name: part_sorting_recovery_v2_targeted_displaced_drop
total_episodes: 4
# seed_base chosen so episode index0 (1st displaced_during_approach) reuses
# seed 2026081681 and index2 (1st drop_and_regrasp) reuses seed 2026081683 -
# the exact seeds that failed in Smoke5-v5 - for a direct regression check.
# index1/index3 are new independent seeds for a second trial of each type.
seed_base: 2026081681

scenario_mix:
  normal_control: 0
  object_displaced_during_approach: 2
  missed_first_grasp: 0
  drop_and_regrasp: 2
  difficult_position: 0

target_object_slot_cycle: [0, 1, 2, 3]

difficult_positions_xyz:
  - [0.62, 0.135, 1.04]
  - [0.75, 0.135, 1.04]
  - [0.88, 0.135, 1.04]
  - [0.585, 0.25, 1.04]
  - [0.915, 0.30, 1.04]

safety:
  workspace_x: [0.575, 0.925]
  workspace_y: [0.130, 0.430]
  workspace_z: [1.00, 1.12]
  minimum_object_separation_m: 0.10
  max_recovery_attempts_per_object: 3
  max_episode_seconds: 180.0
  joint_limit_margin_rad: 0.01
  gripper_limit_tolerance_m: 0.001

recovery:
  displacement_threshold_m: 0.03
  # Lowered from 0.14 m/s and now re-applied every physics step (sustained
  # push, see _apply_physical_displacement) instead of a one-shot kick, so
  # nominal displacement = 0.10 * (15/30) = 0.05 m, mid-range of the
  # requested 0.03-0.08 m target instead of unpredictably ~0 or >0.2 m.
  displacement_velocity_world_mps: [0.10, 0.0, 0.0]
  displacement_steps: 15
  missed_grasp_offset_world_m: [0.07, 0.0, 0.0]
  retreat_height_m: 0.30
  # Lowered from 0.08 m: the 0.08 m release height was imparting enough
  # impact energy for the part to bounce/slide up to ~0.26 m across the
  # table on landing (observed in Smoke5-v5 episode 3 attempt 2), which is
  # what pushed it outside the recoverable workspace.
  drop_release_height_above_table_m: 0.03
  drop_settle_steps: 30
  post_release_settle_steps: 10

ik_safety:
  max_robot_base_target_norm_m: 1.45
  max_target_delta_m: 1.25

dataset_contract:
  fps: 30
  rgb_cameras: 4
  observation_state_dim: 48
  action_dim: 20
  object_pose_dimensions: [20, 47]
  object_poses_policy_input: false
  temporal_convention: observation_t paired with action_selected_from_observation_t before world.step
